<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Life สัปดาห์วิทยาศาสตร์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .stamp-checked {
      background: radial-gradient(circle, #dcfce7 0%, #bbf7d0 100%);
      border-color: #22c55e !important;
      transform: scale(0.98);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-4">

  <!-- VIEW 1: หน้า ล็อกอินนักเรียน -->
  <div id="loginView" class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8 border border-slate-100">
    <div class="text-center mb-8">
      <div class="inline-block p-4 rounded-2xl bg-blue-50 text-blue-600 mb-3 text-3xl">🤖</div>
      <h1 class="text-2xl font-extrabold text-slate-800">Smart Life สัปดาห์วิทยาศาสตร์</h1>
      <p class="text-sm text-slate-500 mt-1">เข้าสู่ระบบเพื่อสะสมแสตมป์กิจกรรม</p>
    </div>

    <form id="studentLoginForm" onsubmit="handleStudentLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username / รหัสนักเรียน</label>
        <input type="text" id="stdUsername" required placeholder="เช่น s34297"
               class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
        <input type="password" id="stdPassword" required placeholder="••••"
               class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800">
      </div>

      <div id="loginError" class="hidden text-red-500 text-xs text-center font-medium mt-2"></div>

      <button type="submit" id="loginBtn" 
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/30 transition-all flex items-center justify-center">
        <span>เข้าสู่ระบบ</span>
      </button>
    </form>
  </div>

  <!-- VIEW 2: หน้า สมุดสะสมแสตมป์ -->
  <div id="dashboardView" class="hidden w-full max-w-md bg-white rounded-3xl shadow-xl p-5 border border-slate-100">
    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
      <div>
        <h2 id="studentNameDisplay" class="font-bold text-base text-slate-800">กำลังโหลด...</h2>
        <p id="studentSchoolDisplay" class="text-xs text-slate-400"></p>
      </div>
      <button onclick="logout()" 
              class="text-xs bg-red-50 hover:bg-red-100 text-red-600 font-semibold px-3 py-1.5 rounded-xl border border-red-100 transition active:scale-95 flex items-center gap-1">
        <span>🚪</span> ออกจากระบบ
      </button>
    </div>

    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-4 text-white mb-5 shadow-md flex justify-between items-center">
      <div>
        <p class="text-xs text-blue-100 font-medium">แสตมป์ที่สะสมได้</p>
        <p class="text-2xl font-black mt-0.5"><span id="stampCount">0</span> <span class="text-sm font-normal text-blue-200">/ <span id="totalBoothCount">20</span> บูธ</span></p>
      </div>
      <button onclick="refreshStamps()" class="bg-white/20 hover:bg-white/30 active:scale-95 text-white px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1">
        🔄 อัปเดต
      </button>
    </div>

    <p class="text-xs font-semibold text-slate-500 mb-3 text-center">แตะที่วงกลมบูธ เพื่อแสดง QR Code ให้สตาฟสแกน</p>

    <div id="stampGrid" class="grid grid-cols-4 gap-3 p-3 bg-slate-50 rounded-2xl border border-slate-200/80 max-h-[350px] overflow-y-auto items-center">
    </div>
  </div>

  <!-- MODAL: แสดง QR Code -->
  <div id="qrModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl transform transition-all">
      <div class="flex justify-between items-start mb-3">
        <div class="text-left">
          <h3 id="modalBoothTitle" class="font-bold text-slate-800 text-base">ชื่อบูธ</h3>
          <p id="modalBoothLoc" class="text-xs text-slate-400">สถานที่</p>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 bg-slate-100 p-1.5 rounded-full w-8 h-8 flex items-center justify-center font-bold">✕</button>
      </div>

      <hr class="mb-4 border-slate-100">

      <div id="modalContent" class="py-2"></div>

      <button onclick="closeModal()" class="w-full mt-5 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl text-sm shadow-md transition">
        ปิดหน้าต่าง
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vnecpsqyivkvlpgfitdq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7Ed2cU6jzNtBWSdpQoQv6w_uFX6ruaE';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentStudentData = null;
    let myCompletedStamps = [];
    let allBooths = [];

    window.onload = function() {
      const savedStudent = localStorage.getItem("currentStudent");
      if (savedStudent) {
        showDashboard(JSON.parse(savedStudent));
      }
    };

    async function handleStudentLogin(event) {
      event.preventDefault();
      const user = document.getElementById("stdUsername").value.trim();
      const pass = document.getElementById("stdPassword").value.trim();
      const btn = document.getElementById("loginBtn");
      const errDiv = document.getElementById("loginError");

      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin mr-2">⏳</span> กำลังตรวจสอบ...`;
      errDiv.classList.add("hidden");

      try {
        const { data, error } = await supabaseClient
          .from('students')
          .select('*')
          .eq('username', user)
          .eq('password', pass)
          .single();

        btn.disabled = false;
        btn.innerHTML = `<span>เข้าสู่ระบบ</span>`;

        if (error || !data) {
          errDiv.innerText = "Username หรือ Password ไม่ถูกต้อง";
          errDiv.classList.remove("hidden");
        } else {
          const studentInfo = {
            studentId: String(data.student_id),
            name: data.name,
            school: data.school
          };
          localStorage.setItem("currentStudent", JSON.stringify(studentInfo));
          showDashboard(studentInfo);
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `<span>เข้าสู่ระบบ</span>`;
        errDiv.innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล";
        errDiv.classList.add("hidden");
      }
    }

    function showDashboard(student) {
      currentStudentData = student;
      document.getElementById("loginView").classList.add("hidden");
      document.getElementById("dashboardView").classList.remove("hidden");
      document.getElementById("studentNameDisplay").innerText = student.name;
      document.getElementById("studentSchoolDisplay").innerText = student.school;

      refreshStamps();
    }

    async function refreshStamps() {
      if (!currentStudentData) return;
      
      document.getElementById("stampCount").innerText = "⏳";

      try {
        const { data: boothsData, error: boothsError } = await supabaseClient
          .from('activities')
          .select('*')
          .order('activity_id', { ascending: true });

        if (boothsError) throw boothsError;
        allBooths = boothsData || [];

        const { data: logsData, error: logsError } = await supabaseClient
          .from('scan_logs')
          .select('activity_id')
          .eq('student_id', currentStudentData.studentId);

        if (logsError) throw logsError;
        
        myCompletedStamps = (logsData || []).map(log => log.activity_id);
        
        document.getElementById("stampCount").innerText = myCompletedStamps.length;
        document.getElementById("totalBoothCount").innerText = allBooths.length;
        renderStampGrid();

      } catch (err) {
        console.error("Error fetching stamps:", err);
        document.getElementById("stampCount").innerText = "0";
      }
    }

    function renderStampGrid() {
      const grid = document.getElementById("stampGrid");
      grid.innerHTML = "";

      allBooths.forEach((booth) => {
        const isDone = myCompletedStamps.includes(booth.activity_id);
        const circleBtn = document.createElement("button");
        circleBtn.onclick = () => openModal(booth, isDone);

        if (isDone) {
          circleBtn.className = "stamp-checked aspect-square rounded-full border-2 border-green-500 flex flex-col items-center justify-center p-1 shadow-sm transition transform active:scale-95";
          circleBtn.innerHTML = `
            <span class="text-lg">✅</span>
            <span class="text-[9px] font-bold text-green-700 truncate w-full text-center">${booth.activity_id}</span>
          `;
        } else {
          circleBtn.className = "bg-white aspect-square rounded-full border-2 border-dashed border-slate-300 hover:border-blue-500 hover:bg-blue-50/50 flex flex-col items-center justify-center p-1 shadow-sm transition transform active:scale-95";
          circleBtn.innerHTML = `
            <span class="text-[10px] font-bold text-slate-400">${booth.activity_id}</span>
            <span class="text-[9px] font-semibold text-slate-600 truncate w-full text-center px-1">${booth.title}</span>
          `;
        }

        grid.appendChild(circleBtn);
      });
    }

    function openModal(booth, isDone) {
      document.getElementById("modalBoothTitle").innerText = booth.title;
      document.getElementById("modalBoothLoc").innerText = `สถานที่: ${booth.location} (${booth.activity_id})`;
      
      const modalContent = document.getElementById("modalContent");

      if (isDone) {
        modalContent.innerHTML = `
          <div class="py-6 text-center">
            <div class="text-5xl mb-3">🎉</div>
            <p class="text-base font-bold text-green-600">ประทับตราเรียบร้อยแล้ว!</p>
            <p class="text-xs text-slate-400 mt-1">คุณได้รับแสตมป์จากบูธนี้แล้วครับ</p>
          </div>
        `;
      } else {
        modalContent.innerHTML = `
          <p class="text-xs text-slate-500 mb-3 font-medium">ยื่น QR Code นี้ให้พี่สตาฟประจำบูธสแกน</p>
          <div class="flex justify-center p-3 bg-slate-50 rounded-2xl border border-slate-200 inline-block">
            <div id="qrcode"></div>
          </div>
          <p id="qrDetail" class="text-xs text-blue-600 font-bold mt-3 bg-blue-50 py-2 rounded-xl border border-blue-100"></p>
        `;

        const qrPayload = `${currentStudentData.studentId}|${booth.activity_id}`;
        
        setTimeout(() => {
          new QRCode(document.getElementById("qrcode"), {
            text: qrPayload,
            width: 170,
            height: 170,
            colorDark : "#0f172a",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
          });
          document.getElementById("qrDetail").innerText = `รหัสนักเรียน: ${currentStudentData.studentId} | บูธ: ${booth.activity_id}`;
        }, 50);
      }

      document.getElementById("qrModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("qrModal").classList.add("hidden");
    }

    function logout() {
      localStorage.removeItem("currentStudent");
      currentStudentData = null;
      myCompletedStamps = [];
      allBooths = [];

      document.getElementById("stdUsername").value = "";
      document.getElementById("stdPassword").value = "";
      document.getElementById("loginError").classList.add("hidden");

      document.getElementById("dashboardView").classList.add("hidden");
      document.getElementById("loginView").classList.remove("hidden");
    }
  </script>
</body>
</html>
