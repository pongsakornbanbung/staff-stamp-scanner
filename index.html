<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Stamp Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 flex items-center justify-center p-3 sm:p-4">

  <!-- 🔗 ใส่ URL จาก Google Apps Script Web App ตรงนี้ -->
  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyZnsTCBtNCW5xumpBs4sa3mPKkJBYKcdCB51-Wi9P5fOJKUUrUa0Hii_nSrrC2e9dANA/exec";
  </script>

  <!-- VIEW 1: หน้าล็อกอินสตาฟ -->
  <div id="staffLoginView" class="w-full max-w-md bg-slate-800 rounded-3xl shadow-2xl p-8 border border-slate-700">
    <div class="text-center mb-8">
      <div class="inline-block p-4 rounded-2xl bg-amber-500/10 text-amber-400 mb-3 text-3xl">🛡️</div>
      <h1 class="text-2xl font-extrabold text-white">Staff Login</h1>
      <p class="text-xs text-slate-400 mt-1">เข้าสู่ระบบสตาฟประจำบูธกิจกรรม</p>
    </div>

    <form onsubmit="handleStaffLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Staff Username</label>
        <input type="text" id="staffUser" required placeholder="เช่น robot01"
               class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Password</label>
        <input type="password" id="staffPass" required placeholder="••••"
               class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>

      <div id="loginError" class="hidden text-red-400 text-xs text-center font-medium mt-2"></div>

      <button type="submit" id="loginBtn" 
              class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center">
        <span>เข้าสู่ระบบสตาฟ</span>
      </button>
    </form>
  </div>

  <!-- VIEW 2: หน้าเครื่องสแกนประทับตรา -->
  <div id="scannerView" class="hidden w-full max-w-md bg-slate-800 rounded-3xl shadow-2xl p-5 border border-slate-700">
    
    <!-- Header ข้อมูลบูธ -->
    <div class="flex justify-between items-center pb-3 border-b border-slate-700 mb-4">
      <div>
        <span id="boothBadge" class="bg-amber-500/20 text-amber-300 text-[10px] font-extrabold px-2 py-0.5 rounded-md uppercase">BOOTH</span>
        <h2 id="boothTitleDisplay" class="font-bold text-base text-white mt-1">ชื่อบูธ...</h2>
        <p id="boothLocDisplay" class="text-xs text-slate-400"></p>
      </div>
      <button onclick="staffLogout()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-xl transition">
        ออก
      </button>
    </div>

    <!-- ช่องสำหรับ Render แสดงกล้อง Live -->
    <div class="relative rounded-2xl overflow-hidden bg-black border border-slate-700 mb-3 min-h-[250px] flex items-center justify-center">
      <div id="reader" class="w-full"></div>
    </div>

    <!-- ปุ่มเลือกถ่ายภาพ / อัปโหลดภาพ QR Code สำรอง -->
    <div class="mb-4 text-center">
      <label for="qrFileInput" class="cursor-pointer inline-flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-amber-400 font-bold text-xs px-4 py-2.5 rounded-xl border border-amber-500/30 transition shadow-sm w-full justify-center">
        📷 ถ่ายรูป / เลือกภาพ QR Code (สำรอง)
      </label>
      <input type="file" id="qrFileInput" accept="image/*" capture="environment" class="hidden" onchange="scanFromFile(this)">
    </div>

    <!-- ช่องยิงบาร์โค้ด / ป้อนรหัสเอง -->
    <div class="mb-4">
      <form onsubmit="handleManualSubmit(event)" class="flex gap-2">
        <input type="text" id="manualInput" placeholder="หรือยิง/พิมพ์ รหัสนักเรียนที่นี่"
               class="flex-1 px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:ring-1 focus:ring-amber-500">
        <button type="submit" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-4 rounded-xl transition">
          บันทึก
        </button>
      </form>
    </div>

    <!-- กล่องแจ้งเตือนผลลัพธ์ -->
    <div id="statusBox" class="hidden p-4 rounded-2xl text-center font-bold text-sm transition-all"></div>
  </div>

  <script>
    let currentStaff = null;
    let html5QrCode = null;
    let isProcessing = false;
    let audioCtx = null;

    window.onload = function() {
      const savedStaff = localStorage.getItem("currentStaff");
      if (savedStaff) {
        showScanner(JSON.parse(savedStaff));
      }
    };

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // ฟังก์ชันส่ง API Request ไปยัง Google Apps Script
    async function callApi(payload) {
      const response = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    async function handleStaffLogin(e) {
      e.preventDefault();
      initAudio();

      const u = document.getElementById("staffUser").value;
      const p = document.getElementById("staffPass").value;
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("loginError");

      btn.disabled = true;
      btn.innerText = "กำลังตรวจสอบ...";
      err.classList.add("hidden");

      try {
        const res = await callApi({ action: 'staffLogin', username: u, password: p });
        btn.disabled = false;
        btn.innerText = "เข้าสู่ระบบสตาฟ";

        if (res.success) {
          localStorage.setItem("currentStaff", JSON.stringify(res.staff));
          showScanner(res.staff);
        } else {
          err.innerText = res.message;
          err.classList.remove("hidden");
        }
      } catch (error) {
        btn.disabled = false;
        btn.innerText = "เข้าสู่ระบบสตาฟ";
        err.innerText = "เชื่อมต่อระบบล้มเหลว กรุณาลองใหม่อีกครั้ง";
        err.classList.remove("hidden");
      }
    }

    function showScanner(staff) {
      currentStaff = staff;
      document.getElementById("staffLoginView").classList.add("hidden");
      document.getElementById("scannerView").classList.remove("hidden");

      document.getElementById("boothBadge").innerText = staff.boothId;
      document.getElementById("boothTitleDisplay").innerText = staff.title;
      document.getElementById("boothLocDisplay").innerText = staff.location;

      startCamera();
    }

    async function startCamera() {
      if (html5QrCode && html5QrCode.isScanning) return;

      const statusBox = document.getElementById("statusBox");

      try {
        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 15, qrbox: { width: 220, height: 220 } };

        // บนโฮสต์นอก Chrome จะขอสิทธิ์กล้องได้อย่างถูกต้องทันที
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          onScanSuccess
        );

        statusBox.classList.add("hidden");
      } catch (err) {
        console.error("Camera Error:", err);
        showStatus("❌ ไม่สามารถเปิดกล้องได้: กรุณาอนุญาตสิทธิ์การเข้าถึงกล้องในเบราว์เซอร์ Chrome", "bg-red-500/20 text-red-300 border border-red-500/30");
      }
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return; 
      processStamp(decodedText);
    }

    async function scanFromFile(input) {
      if (input.files && input.files[0]) {
        initAudio();
        const file = input.files[0];
        showStatus("⏳ กำลังอ่านภาพ QR Code...", "bg-amber-500/20 text-amber-300 border border-amber-500/30");

        try {
          if (html5QrCode && html5QrCode.isScanning) {
            await html5QrCode.stop();
          }

          const fileScanner = new Html5Qrcode("reader");
          const decodedText = await fileScanner.scanFile(file, true);
          
          processStamp(decodedText);
          input.value = "";
          setTimeout(startCamera, 1000);

        } catch (err) {
          showStatus("❌ ไม่พบ QR Code ในภาพ ลองถ่ายใหม่อีกครั้งครับ", "bg-red-500/20 text-red-300 border border-red-500/30");
          input.value = "";
        }
      }
    }

    function handleManualSubmit(e) {
      e.preventDefault();
      initAudio();
      const val = document.getElementById("manualInput").value.trim();
      if (val) {
        processStamp(val);
        document.getElementById("manualInput").value = "";
      }
    }

async function processStamp(payload) {
  if (isProcessing) return;
  isProcessing = true;
  showStatus("⏳ กำลังบันทึกแสตมป์...", "bg-amber-500/20 text-amber-300 border border-amber-500/30");

  try {
    // 🔀 สลับตรงนี้: เอาค่า payload (รหัสเด็ก) มาใส่ boothId และเอา boothId ไปใส่ studentId 
    // เพื่อให้วิ่งไปชนกับ doPost เก่าที่สลับรับค่าอยู่
    const res = await callApi({ 
      action: 'recordStamp', 
      boothId: payload,              // เอา รหัสเด็ก (payload) มาลงตรงนี้
      studentId: currentStaff.boothId // เอา รหัสบูธ มาลงตรงนี้
    });

    if (res.success) {
      showStatus(`✅ ${res.message}`, "bg-green-500/20 text-green-300 border border-green-500/30");
      playAudio(true);
    } else if (res.isDuplicate) {
      showStatus(`⚠️ ${res.message}`, "bg-yellow-500/20 text-yellow-300 border border-yellow-500/30");
      playAudio(false);
    } else {
      showStatus(`❌ ${res.message}`, "bg-red-500/20 text-red-300 border border-red-500/30");
      playAudio(false);
    }
  } catch (err) {
    showStatus("❌ บันทึกล้มเหลว ไม่สามารถติดต่อเซิร์ฟเวอร์ได้", "bg-red-500/20 text-red-300 border border-red-500/30");
    playAudio(false);
  }

  setTimeout(() => {
    isProcessing = false;
  }, 2500);
}

    function showStatus(msg, classes) {
      const box = document.getElementById("statusBox");
      box.className = `p-4 rounded-2xl text-center font-bold text-sm transition-all ${classes}`;
      box.innerText = msg;
      box.classList.remove("hidden");
    }

    function playAudio(isSuccess) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (isSuccess) {
          osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        } else {
          osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        }

        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.error("Audio error", e);
      }
    }

    function staffLogout() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          resetToLogin();
        }).catch(err => resetToLogin());
      } else {
        resetToLogin();
      }
    }

    function resetToLogin() {
      localStorage.removeItem("currentStaff");
      currentStaff = null;
      document.getElementById("scannerView").classList.add("hidden");
      document.getElementById("staffLoginView").classList.remove("hidden");
    }
  </script>
</body>
</html>
