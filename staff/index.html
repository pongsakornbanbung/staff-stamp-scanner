<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสตาฟสแกนแสตมป์ - Smart Life</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- โหลดไลบรารี HTML5 QR Code Scanner สำหรับใช้กล้องมือถือสแกน -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-4">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-5 border border-slate-100">
    <!-- Header -->
    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
      <div>
        <h1 class="font-bold text-base text-slate-800">📸 ระบบสตาฟสแกนแสตมป์</h1>
        <p class="text-xs text-slate-400">สัปดาห์วิทยาศาสตร์ Smart Life</p>
      </div>
      <div id="boothBadge" class="text-xs bg-blue-50 text-blue-600 font-semibold px-3 py-1.5 rounded-xl border border-blue-100">
        รอเลือกบูธ
      </div>
    </div>

    <!-- เลือกบูธประจำตัวสตาฟ -->
    <div class="mb-4 bg-slate-50 p-3 rounded-2xl border border-slate-200">
      <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">เลือกบูธที่คุณประจำการ</label>
      <select id="staffBoothSelect" onchange="updateStaffBooth()" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium">
        <option value="">-- กำลังโหลดรายชื่อบูธ... --</option>
      </select>
    </div>

    <!-- ส่วนสแกนกล้อง -->
    <div class="mb-4">
      <div id="reader" class="w-full rounded-2xl overflow-hidden border border-slate-200 bg-black"></div>
    </div>

    <!-- ฟอร์มกรอกรหัสสำรอง (กรณีสแกนกล้องไม่ได้) -->
    <div class="mb-4 bg-slate-50 p-3 rounded-2xl border border-slate-200">
      <p class="text-xs font-semibold text-slate-600 mb-2">หรือกรอกรหัสนักเรียนด้วยตนเอง</p>
      <div class="flex gap-2">
        <input type="text" id="manualStudentId" placeholder="เช่น 34297 หรือ s34297" 
               class="flex-1 px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="handleManualSubmit()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition active:scale-95 shadow-sm">
          บันทึก
        </button>
      </div>
    </div>

    <!-- กล่องแสดงสถานะผลการสแกน -->
    <div id="resultBox" class="hidden p-4 rounded-2xl text-center border transition-all">
      <p id="resultIcon" class="text-3xl mb-1"></p>
      <p id="resultTitle" class="font-bold text-sm"></p>
      <p id="resultDesc" class="text-xs mt-0.5 text-slate-500"></p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vnecpsqyivkvlpgfitdq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7Ed2cU6jzNtBWSdpQoQv6w_uFX6ruaE';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let html5QrCode = null;
    let selectedBoothId = localStorage.getItem("staffSelectedBooth") || "";

    window.onload = async function() {
      await loadBoothDropdown();
      initScanner();
    };

    // โหลดรายชื่อบูธใส่ Dropdown จากตาราง activities (ใช้ activity_id)
    async function loadBoothDropdown() {
      const select = document.getElementById("staffBoothSelect");
      try {
        const { data, error } = await supabaseClient
          .from('activities')
          .select('activity_id, title')
          .order('activity_id', { ascending: true });

        if (error) throw error;

        select.innerHTML = '<option value="">-- กรุณาเลือกบูธของคุณ --</option>';
        (data || []).forEach(booth => {
          const opt = document.createElement("option");
          opt.value = booth.activity_id;
          opt.textContent = `(${booth.activity_id}) ${booth.title}`;
          if (booth.activity_id === selectedBoothId) {
            opt.selected = true;
          }
          select.appendChild(opt);
        });

        if (selectedBoothId) {
          document.getElementById("boothBadge").innerText = `บูธ: ${selectedBoothId}`;
        }
      } catch (err) {
        console.error("Error loading booths:", err);
        select.innerHTML = '<option value="">โหลดรายชื่อบูธไม่สำเร็จ</option>';
      }
    }

    function updateStaffBooth() {
      const select = document.getElementById("staffBoothSelect");
      selectedBoothId = select.value;
      localStorage.setItem("staffSelectedBooth", selectedBoothId);
      
      if (selectedBoothId) {
        document.getElementById("boothBadge").innerText = `บูธ: ${selectedBoothId}`;
      } else {
        document.getElementById("boothBadge").innerText = `รอเลือกบูธ`;
      }
    }

    // เริ่มต้นใช้งานกล้องสแกน QR Code
    function initScanner() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 220, height: 220 } };

      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess,
        onScanFailure
      ).catch(err => {
        console.warn("ไม่สามารถเปิดกล้องได้อัตโนมัติ:", err);
      });
    }

    // เมื่อสแกน QR Code สำเร็จ (รูปแบบที่ส่งมาคือ studentId|activity_id)
    async function onScanSuccess(decodedText) {
      console.log("Scanned:", decodedText);
      
      let studentId = "";
      let targetBooth = "";

      if (decodedText.includes("|")) {
        const parts = decodedText.split("|");
        studentId = parts[0].trim();
        targetBooth = parts[1].trim();
      } else {
        studentId = decodedText.trim();
      }

      // ถ้าหน้าสตาฟเลือกบูธไว้ ให้ใช้บูธที่เลือก หรือถ้าใน QR มีระบุมา ให้ยึดตามที่สตาฟล็อกอินเลือกไว้เป็นหลัก
      const boothToRecord = selectedBoothId || targetBooth;
      
      if (!boothToRecord) {
        showResult(false, "⚠️ กรุณาเลือกบูธประจำตัวก่อนสแกน", "คุณยังไม่ได้เลือกช่องบูธด้านบน");
        return;
      }

      await processStamp(studentId, boothToRecord);
    }

    function onScanFailure(error) {
      // ปล่อยว่างไว้เพื่อไม่ให้ Console รกเวลากล้องยังหา QR ไม่เจอ
    }

    async function handleManualSubmit() {
      const input = document.getElementById("manualStudentId");
      const studentId = input.value.trim();

      if (!studentId) {
        alert("กรุณากรอกรหัสนักเรียน");
        return;
      }

      if (!selectedBoothId) {
        alert("กรุณาเลือกบูธประจำตัวของคุณก่อนบันทึก");
        return;
      }

      await processStamp(studentId, selectedBoothId);
      input.value = "";
    }

    // ฟังก์ชันบันทึกข้อมูลลงตาราง scan_logs (ใช้ activity_id ทั้งระบบ)
    async function processStamp(studentId, activityId) {
      const box = document.getElementById("resultBox");
      
      try {
        // 1. ตรวจสอบว่ามีนักเรียนคนนี้อยู่ในระบบไหม
        const { data: stdData, error: stdError } = await supabaseClient
          .from('students')
          .select('*')
          .eq('student_id', studentId)
          .single();

        if (stdError || !stdData) {
          // ลองเช็คช่อง username เผื่อกรอกรหัสสั้นมา
          const { data: stdUserdata, error: stdUserError } = await supabaseClient
            .from('students')
            .select('*')
            .eq('username', studentId)
            .single();

          if (stdUserError || !stdUserdata) {
            showResult(false, "❌ ไม่พบรหัสนักเรียนนี้ในระบบ", `ID: ${studentId}`);
            return;
          }
          studentId = String(stdUserdata.student_id);
        }

        // 2. ตรวจสอบว่าเคยสแกนบูธนี้ไปแล้วหรือยัง
        const { data: existingLog, error: logError } = await supabaseClient
          .from('scan_logs')
          .select('*')
          .eq('student_id', studentId)
          .eq('activity_id', activityId)
          .maybeSingle();

        if (existingLog) {
          showResult(false, "⚠️ นักเรียนคนนี้เคยสะสมบูธนี้แล้ว", `รหัส: ${studentId} | บูธ: ${activityId}`);
          return;
        }

        // 3. บันทึกข้อมูลลงตาราง scan_logs (ใช้ activity_id)
        const { error: insertError } = await supabaseClient
          .from('scan_logs')
          .insert([
            { student_id: studentId, activity_id: activityId }
          ]);

        if (insertError) throw insertError;

        showResult(true, "🎉 บันทึกแสตมป์สำเร็จ!", `รหัสนักเรียน: ${studentId} ได้รับแสตมป์บูธ ${activityId} แล้ว`);

      } catch (err) {
        console.error("Database error:", err);
        showResult(false, "❌ เกิดข้อผิดพลาดในการบันทึก", err.message);
      }
    }

    functionaccouchement
    function showResult(isSuccess, title, desc) {
      const box = document.getElementById("resultBox");
      const icon = document.getElementById("resultIcon");
      const titleEl = document.getElementById("resultTitle");
      const descEl = document.getElementById("resultDesc");

      box.classList.remove("hidden");
      if (isSuccess) {
        box.className = "p-4 rounded-2xl text-center border bg-green-50 border-green-200 text-green-800 transition-all";
        icon.innerText = "✅";
      } else {
        box.className = "p-4 rounded-2xl text-center border bg-red-50 border-red-200 text-red-800 transition-all";
        icon.innerText = "⚠️";
      }

      titleEl.innerText = title;
      descEl.innerText = desc;

      // ซ่อนข้อความแจ้งเตือนอัตโนมัติหลังผ่านไป 4 วินาทีเพื่อให้พร้อมสแกนคนถัดไป
      setTimeout(() => {
        box.classList.add("hidden");
      }, 4000);
    }
  </script>
</body>
</html>
